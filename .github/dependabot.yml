#
# Dependency update policy (01 O-S04, 16 section 10.2, ADR-0003 C-30, SEC-71/73). Procedure for
# maintainers: docs/security/supply-chain.md "Dependabot pull requests".
# - Version updates are grouped per ecosystem and opened once a month (ADR-0003 C-30 replaces the
#   weekly interval of docs/19 sections 6.1 and 8). Minor and patch updates share one pull request per
#   ecosystem; major updates open their own pull requests. A 7-day cooldown skips releases younger than
#   a week (cooldown applies to version updates only).
# - Security updates do not follow this schedule: GitHub opens them as soon as an advisory affects a
#   dependency, because "Dependabot alerts" and "Dependabot security updates" are enabled in the
#   repository settings (.github/scripts/branch-protection.sh). They are grouped per ecosystem too.
# - Pull requests are labelled "dependencies" (.github/scripts/create-labels.sh); a maintainer decides
#   whether a CHANGELOG line is needed (security fixes always get one) or adds the no-changelog label.
# - Gradle: Dependabot cannot regenerate gradle/verification-metadata.xml and the lock files. Until a
#   maintainer regenerates them on the Dependabot branch (docs/dev-setup.md section 7), the pull request
#   build fails dependency verification by design.
# - Docker: only the sample application Dockerfiles. The Compose images (deploy/compose) must stay equal
#   to deploy/*/image.properties and the Jib base images live in build.gradle.kts, so both are updated
#   by hand once a month together with the other pins outside Dependabot (docs/security/supply-chain.md).
# Checked by .github/scripts/test/dependabot-config.test.sh.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Asia/Seoul
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "deps(gradle)"
    groups:
      gradle-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      gradle-security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Asia/Seoul
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - dependencies
      - area/ui
    commit-message:
      prefix: "deps(ui)"
    groups:
      ui-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      ui-security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Asia/Seoul
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      actions-security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: docker
    directories:
      - /sample-apps/*
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Asia/Seoul
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "deps(docker)"
    groups:
      docker-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      docker-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
