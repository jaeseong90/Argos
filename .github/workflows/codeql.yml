# SPDX-License-Identifier: Apache-2.0
#
# CodeQL static analysis for Java and TypeScript/JavaScript (O-S04, docs/16 section 10.5).
# Runs on pull requests, on pushes to trusted branches and weekly on main to pick up new queries.
# build-mode none analyses the sources without building, so no toolchain or network access to
# dependency repositories is needed. Queries (default + security-extended) and the paths that are
# not analysed (negative fixtures, seed data, generated code only) are in
# .github/codeql/codeql-config.yml; .github/scripts/test/supply-chain-workflows.test.sh checks both
# files (T-BLD-028, proposed).
name: CodeQL

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml
      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
