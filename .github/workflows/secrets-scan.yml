# SPDX-License-Identifier: Apache-2.0
#
# Secret scanning with gitleaks (SEC-73, SEC-74, docs/16 section 10.5) using the pinned container
# image through .github/scripts/run-gitleaks.sh (no third-party action, no license key, no network
# access inside the scanner container).
# - pull_request: the commits of the pull request and the checked-out tree (the merge result);
# - push: the pushed commits and the checked-out tree;
# - weekly schedule and manual runs: the full history of the repository.
# A commit-range scan reads commit diffs, which leave out content that only a merge commit adds
# (conflict resolutions, "evil merges"); the tree scan catches such content.
name: Secrets scan

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          case "$EVENT_NAME" in
            pull_request)
              bash .github/scripts/run-gitleaks.sh git "${PR_BASE_SHA}..${PR_HEAD_SHA}"
              ;;
            push)
              if [[ -z "$PUSH_BEFORE" || "$PUSH_BEFORE" =~ ^0+$ ]] || ! git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
                bash .github/scripts/run-gitleaks.sh git
              else
                bash .github/scripts/run-gitleaks.sh git "${PUSH_BEFORE}..${PUSH_AFTER}"
              fi
              ;;
            *)
              bash .github/scripts/run-gitleaks.sh git
              ;;
          esac
      - name: Scan checked-out tree
        # Runs even when the commit scan failed, so one run reports both kinds of findings.
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'push') }}
        run: bash .github/scripts/run-gitleaks.sh dir
