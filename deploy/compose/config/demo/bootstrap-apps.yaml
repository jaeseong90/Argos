#
# Applications that the server registers at its start in demo mode (argos.bootstrap.apps-file,
# ARGOS_BOOTSTRAP_APPS_FILE; docs/17 section 3.2 and 3.9). For each entry the server creates the
# application when it does not exist (the recommended alert rules follow by the server's own job)
# and registers the agent token read from token-file, storing only its SHA-256 hash and prefix; a
# token that is already registered is skipped, so a restart changes nothing. No secret is written
# here: the token files are generated by ./argos-env-init.sh --demo in secrets/ (0600) and mounted
# by compose.demo.yaml under /run/secrets.

apps:
  - name: order-api
    env: demo
    token-file: /run/secrets/demo_order_api_token
  - name: payment-api
    env: demo
    token-file: /run/secrets/demo_payment_api_token
