# SPDX-License-Identifier: Apache-2.0
#
# Reverse proxy of compose.proxy.yaml (docs/17 section 3.10): TLS on 443, forwards the UI, the REST
# API and the WebSocket /ws to the Argos server. The server sets the security headers itself
# (Content-Security-Policy, HSTS, ...); this proxy adds none, so they are not duplicated.
#
# nginx does not merge proxy_set_header: a location that sets one header drops every header set
# at the server level. Each location below therefore sets the full list.
#
# X-Forwarded-For is overwritten with the address that connects to this proxy, never appended to
# (appending would keep a value the client sent): the server trusts the header from
# this proxy's address only (compose.proxy.yaml) and takes its value as the client address of rate
# limits and the audit log.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  server_tokens off;
  access_log off;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  # 17 section 3.10: request bodies up to 10 MB, timeouts of at least 65 s (WebSocket keepalive).
  client_max_body_size 10m;
  proxy_connect_timeout 10s;
  proxy_send_timeout 75s;
  proxy_read_timeout 75s;
  proxy_http_version 1.1;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream argos_server {
    server server:8080;
    keepalive 16;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/tls/proxy.crt;
    ssl_certificate_key /etc/nginx/tls/proxy.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:argos_tls:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    # REST API (14 section 2).
    location /api/ {
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 443;
      proxy_set_header Connection "";
      proxy_pass http://argos_server;
    }

    # WebSocket (14 section 5): the upgrade passes through; an idle connection may stay open
    # longer than the 30 s keepalive of the server.
    location = /ws {
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 443;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
      proxy_pass http://argos_server;
    }

    # The UI and everything else.
    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 443;
      proxy_set_header Connection "";
      proxy_pass http://argos_server;
    }
  }
}
