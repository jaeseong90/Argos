      description: The statement's text (sql_normalized at most 2 KB, sql_text at most 64 KB), series (percentiles estimated, C-14) and targets of [from, to) from sql_stat_*; the services and related transactions (xlog.sql_ids, A-10) and instances (sql_stat_raw) of raw_window. wait_ms_total is not measured (no per-statement attribution of pool wait yet; ADR-0010 C-178), always null. 404 for an unknown key. meta.source follows the source rule of 14 §3 (at most 1 year). 64-bit ids (service_id, sql_id, db_id, host_id, group_id, version_id) are unsigned decimal strings.
      operationId: sql_get
      parameters:
      - in: path
        name: appId
        required: true
        schema:
          format: int32
          type: integer
      - description: SQL key (unsigned decimal)
        in: path
        name: sqlId
        required: true
        schema:
          pattern: ^[0-9]{1,20}$
          type: string
      - in: query
        name: from
        required: true
        schema:
          type: string
      - in: query
        name: to
        required: true
        schema:
          type: string
      - in: query
        name: kind
        required: false
        schema:
          type: string
      - in: query
        name: step
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEnvelopeSqlDetail'
          description: OK
      summary: One SQL statement
      tags:
      - stats-controller
      x-argos-limits:
        range_max: 1y
        timeout_s: 10
      x-argos-role: viewer
      x-argos-source:
      - sql_stat_raw
      - sql_stat_1m
      - sql_stat_1h
      - xlog
      - postgres:dictionary
  /api/v1/apps/{appId}/transactions/search:
    post:
      description: 'Every filter of 14 §4.6; sort elapsed_ms:desc (default) or ts:desc; keyset paging with meta.next_cursor; at most 1,000 rows a page, ranges up to 24 h (user, request and trace id searches without from and to default to the last hour; that 1 h range is fixed by the first page and carried by its cursor, so later pages read the same hour, and meta.from/meta.to give the range used; any other search without from or to answers 400 range_invalid, detail missing). format=csv exports up to 10,000 rows (more: 400 limit_exceeded) and records EXPORT_CSV. A user_id filter on an application in hashed mode answers 422 filter_invalid (user_id_hash_unavailable) until application salts exist.'
      operationId: transactions_search
      parameters:
      - in: path
        name: appId
        required: true
        schema:
          format: int32
          type: integer
      - description: json (default) or csv
        in: query
        name: format
        required: false
        schema:
          enum:
          - json
          - csv
          type: string
      - description: IANA time zone of the CSV times (UTC by default)
        in: query
        name: tz
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionSearchRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionSearchResponse'
            text/csv:
              schema:
                format: binary
                type: string
          description: A page (JSON) or the export (CSV)
      summary: Search the transactions of an application
      tags:
      - transactions-controller
      x-argos-audit: EXPORT_CSV
      x-argos-csv: true
      x-argos-limits:
        range_max: 24h
        rows_max: 1000
        timeout_s: 10
      x-argos-role: viewer
      x-argos-source:
      - xlog
  /api/v1/apps/{appId}/xlog:
    get:
      description: 'Range at most 24 h. With more points than limit (at most 100,000) the server samples deterministically (A-5): every error, every slow point (elapsed_ms >= meta.slow_threshold_ms) and cityHash64(tx_id) % N = 0, N = ceil(total / limit); meta.shown, meta.total and meta.sampling.rule say so, and the same request returns the same points. Inside the limit errors and slow points come first (sampled points beyond it are dropped evenly over the range); only when errors and slow points alone exceed limit are some of them left out. meta.truncated is true when more points satisfy the sampling rule than limit, so that some of them (sampled points first) were left out: narrow the range or raise limit. 64-bit ids are decimal strings. The body is gzip-compressed for clients that accept it (above 2 KB). meta.outages lists the collection outages of the range (the dashboard''s spans, from the instance state events and the server''s stop and start events).'
      operationId: xlog_get
      parameters:
      - in: path
        name: appId
        required: true
        schema:
          format: int32
          type: integer
      - description: Range start, ISO-8601 UTC
        in: query
        name: from
        required: true
        schema:
          type: string
      - description: Range end (exclusive)
        in: query
        name: to
        required: true
        schema:
          type: string
      - description: HTTP (default), BATCH, MESSAGE, ALL
        in: query
        name: kind
        required: false
        schema:
          type: string
      - description: Service keys (decimal), repeatable, at most 100
        in: query
        name: service
        required: false
        schema:
          items:
            pattern: ^[0-9]{1,20}$
            type: string
          type: array
      - description: Instances, repeatable, at most 100
        in: query
        name: instance
        required: false
        schema:
          items:
            format: int32
            type: integer
          type: array
      - in: query
        name: error
        required: false
        schema:
          type: boolean
      - in: query
        name: min_ms
        required: false
        schema:
          format: int64
          type: integer
      - in: query
        name: max_ms
        required: false
        schema:
          format: int64
          type: integer
      - description: Most points, 1 to 100,000 (default 100,000)
        in: query
        name: limit
        required: false
        schema:
          format: int32
          type: integer
      - description: 'status (default), instance or service: a UI hint, validated only'
        in: query
        name: color_by
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XlogResponse'
          description: The points
      summary: XLog points of a range in columns
      tags:
      - xlog-controller
      x-argos-limits:
        range_max: 24h
        rows_max: 100000
        timeout_s: 10
      x-argos-role: viewer
      x-argos-source:
      - xlog
      - postgres:dictionary
      - postgres:apps
      - postgres:instances
      - postgres:events
  /api/v1/apps/{appId}/xlog/summary:
    post:
      description: count, then the 10 largest groups by service, instance, exception class (failed transactions) and HTTP status. Range at most 24 h. A read-only query whose filters travel in the body.
