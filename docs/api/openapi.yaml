          - tx
          - trace
          - user
          - request
          - service
          - sql
          - instance
          type: string
      - description: Restrict to an application
        in: query
        name: app
        required: false
        schema:
          format: int32
          type: integer
      - description: Restrict to an environment
        in: query
        name: env
        required: false
        schema:
          type: string
      - in: query
        name: from
        required: false
        schema:
          type: string
      - in: query
        name: to
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEnvelopeSearchResult'
          description: OK
      summary: Find transactions, traces, services, SQL and instances
      tags:
      - search-controller
      x-argos-limits:
        range_max: 24h
        rows_max: 100
        timeout_s: 10
      x-argos-role: viewer
      x-argos-source:
      - xlog
      - postgres:dictionary
      - postgres:instances
