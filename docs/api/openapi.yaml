#
# Argos REST API v1. Generated by ./gradlew :server:generateOpenApi from the server's controllers
# (ADR-0003 C-28); do not edit by hand: the contract test fails when this file differs from a
# fresh generation.
openapi: 3.1.0
info:
  title: Argos API
  version: v1
servers:
- url: /
paths:
  /api/v1/admin/storage/health:
    get:
      description: ClickHouse disks, the partitions with the most active parts, merges, insert health counters, mutations (system tables read as argos_reader), the server's WAL and unresolved dictionary ids. ttl_last_run_at and emergency_retention_active are null until the storage health job exists (WO-28).
      operationId: storage_health_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEnvelopeStorageHealth'
          description: OK
      summary: Storage health
      tags:
      - health-controller
      x-argos-limits:
        timeout_s: 10
      x-argos-role: operator
      x-argos-source:
      - system.parts
      - system.merges
      - system.events
      - system.disks
      - system.mutations
      - memory:meters
  /api/v1/admin/users:
    get:
      operationId: admin_users_list
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeListAdminUserView'
          description: OK
      tags:
      - admin-users-controller
      x-argos-role: admin
    post:
      operationId: admin_users_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeCreateUserResponse'
          description: Created
      tags:
      - admin-users-controller
      x-argos-audit: USER_CREATED
      x-argos-role: admin
  /api/v1/admin/users/{id}:
    patch:
      operationId: admin_users_patch
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchUserRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeAdminUserView'
          description: OK
      tags:
      - admin-users-controller
      x-argos-audit: USER_UPDATED,ROLE_CHANGED,USER_DISABLED,SESSION_REVOKED
      x-argos-role: admin
  /api/v1/admin/users/{id}/password/reset:
    post:
      operationId: admin_users_reset_password
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: No Content
      tags:
      - admin-users-controller
      x-argos-audit: PASSWORD_RESET,SESSION_REVOKED
      x-argos-role: admin
  /api/v1/admin/users/{id}/sessions/revoke:
    post:
      operationId: admin_users_revoke_sessions
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
      tags:
      - admin-users-controller
      x-argos-audit: SESSION_REVOKED
      x-argos-role: admin
  /api/v1/admin/users/{id}/unlock:
    post:
      operationId: admin_users_unlock
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
      tags:
      - admin-users-controller
      x-argos-audit: ACCOUNT_UNLOCKED
      x-argos-role: admin
  /api/v1/alerts/channels:
    get:
      operationId: channels_list
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeListChannelView'
          description: OK
      tags:
      - channels-controller
      x-argos-role: viewer
    post:
      operationId: channels_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChannelRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeCreatedChannelView'
          description: Created
      tags:
      - channels-controller
      x-argos-audit: CHANNEL_CREATED
      x-argos-role: admin
  /api/v1/alerts/channels/{id}:
    delete:
      operationId: channels_delete
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
      tags:
      - channels-controller
      x-argos-audit: CHANNEL_DELETED
      x-argos-role: admin
    put:
      operationId: channels_update
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChannelRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeChannelView'
          description: OK
      tags:
      - channels-controller
      x-argos-audit: CHANNEL_UPDATED
      x-argos-role: admin
  /api/v1/alerts/channels/{id}/signing-key/rotate:
    post:
      operationId: channels_rotate
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeRotatedKeyView'
          description: OK
      tags:
      - channels-controller
      x-argos-audit: CHANNEL_SIGNING_KEY_ROTATED
      x-argos-role: admin
  /api/v1/alerts/channels/{id}/test:
    post:
      operationId: channels_test
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeTestResultView'
          description: OK
      tags:
      - channels-controller
      x-argos-audit: CHANNEL_TEST_SENT
      x-argos-role: admin
  /api/v1/alerts/events:
    get:
      description: The state transitions of [from, to) (at most 366 days, the 365-day retention), newest first, with the delivery of each event per channel (F-S27; last_error_code is an error code, never a response body). delivery=failed keeps the events with a failed delivery. Pages of limit (default 100, at most 500) continue with cursor = meta.next_cursor. Every application's active alerts are GET /overview/alerts.
      operationId: alerts_events_list
      parameters:
      - in: query
        name: from
        required: true
        schema:
          type: string
      - in: query
        name: to
        required: true
        schema:
          type: string
      - description: Application id
        in: query
        name: app
        required: false
        schema:
          format: int32
          type: integer
      - in: query
        name: env
        required: false
        schema:
          type: string
      - description: warn or critical
        in: query
        name: severity
        required: false
        schema:
          type: string
      - description: OK, PENDING, FIRING, ACKED, RESOLVED or NO_DATA
        in: query
        name: state
        required: false
        schema:
          type: string
      - description: Rule id
        in: query
        name: rule
        required: false
        schema:
          type: string
      - description: 'failed: only events with a failed delivery'
        in: query
        name: delivery
        required: false
        schema:
          type: string
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: Rows of a page, at most 500 (default 100)
        in: query
        name: limit
        required: false
        schema:
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEnvelopeListAlertEvent'
          description: OK
      summary: Alert events
      tags:
      - alert-events-controller
      x-argos-limits:
        range_max: 366d
        rows_max: 500
        timeout_s: 10
      x-argos-role: viewer
      x-argos-source:
      - postgres:alert_events
      - postgres:alert_rules
      - postgres:notification_deliveries
  /api/v1/alerts/events/{eventId}/ack:
    post:
      description: 'eventId is the FIRING event of the current firing (event_id of the active alert). The alert becomes ACKED: renotifications stop, the RESOLVED notification is still sent (F-S26). 409 invalid_state when the alert is not FIRING (already acknowledged or resolved), 404 for an unknown event. note at most 1 KB.'
      operationId: alerts_events_ack
      parameters:
      - in: path
        name: eventId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertAckRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeAlertAck'
          description: OK
      summary: Acknowledge a firing alert
      tags:
      - alert-events-controller
      x-argos-audit: RULE_ACKED
      x-argos-role: operator
  /api/v1/alerts/mutes:
    get:
      description: The one-off mutes that have not ended, by start, at most 1,000.
      operationId: alerts_mutes_list
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeListAlertMute'
          description: OK
      summary: Alert mutes
      tags:
      - alert-events-controller
      x-argos-limits:
        rows_max: 1000
      x-argos-role: operator
      x-argos-source:
      - postgres:mutes
    post:
      description: 'No rule matching the target (every target field optional: absent matches any) is evaluated between from and to. At most 30 days, ending in the future (400 invalid_request otherwise); reason at most 1 KB.'
      operationId: alerts_mutes_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertMuteRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeAlertMute'
          description: Created
      summary: Create an alert mute
      tags:
      - alert-events-controller
      x-argos-audit: MUTE_CREATED
      x-argos-role: operator
  /api/v1/alerts/mutes/{muteId}:
    delete:
      operationId: alerts_mutes_delete
      parameters:
      - in: path
        name: muteId
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
      summary: Delete an alert mute
      tags:
      - alert-events-controller
      x-argos-audit: MUTE_DELETED
      x-argos-role: operator
  /api/v1/alerts/rules:
    get:
      description: The rules that are not deleted, newest first, at most 1,000 (meta.truncated at the limit). Without app every rule, server self rules included; env matches the rules of that environment and those of every environment.
      operationId: alerts_rules_list
      parameters:
      - description: Application id
        in: query
        name: app
        required: false
        schema:
          format: int32
          type: integer
      - description: Environment
        in: query
        name: env
        required: false
        schema:
          type: string
      - description: Only enabled (true) or only disabled (false) rules
        in: query
        name: enabled
        required: false
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeListAlertRule'
          description: OK
      summary: Alert rules
      tags:
      - alert-rules-controller
      x-argos-limits:
        rows_max: 1000
      x-argos-role: viewer
      x-argos-source:
      - postgres:alert_rules
    post:
      description: 400 invalid_request with one detail per invalid field (unknown fields included), 422 template_variable_forbidden for a message template variable outside the allowed set (SEC-39). The application and the channels must exist.
      operationId: alerts_rules_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRuleRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeAlertRule'
          description: Created
      summary: Create an alert rule
      tags:
      - alert-rules-controller
      x-argos-audit: RULE_CREATED
      x-argos-role: operator
  /api/v1/alerts/rules/preview:
    post:
      description: 'The rule''s metric over the last days (default and at most 7) from the minute rollups, in consecutive buckets of step_s (the rule window rounded up to whole minutes, at least days × 1440 / 336 minutes, so short windows are smoothed), and the firings its warn (or critical) threshold would have caused: a run of breaching buckets (with at least min_samples requests for request metrics) lasting at least for. Metrics outside the rollups (active transactions, server self metrics, instance state, batch elapsed time) answer 400 with metric/preview_unsupported; a service, instance or host rule needs one target id. Heavy rate-limit bucket (14 §2.7).'
      operationId: alerts_rules_preview
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRulePreviewRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeAlertRulePreview'
          description: OK
      summary: Preview an alert rule
      tags:
      - alert-rules-controller
      x-argos-audit: none
      x-argos-limits:
        range_max: 7d
        rows_max: 336
        timeout_s: 25
      x-argos-role: operator
      x-argos-source:
      - instance_stat_1m
      - service_stat_1m
      - ext_stat_1m
      - metric_1m
  /api/v1/alerts/rules/{ruleId}:
    delete:
      description: 'Soft delete: the rule leaves the lists and the engine (its active alerts resolve), its events stay readable for their retention.'
      operationId: alerts_rules_delete
      parameters:
      - in: path
        name: ruleId
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
      summary: Delete an alert rule
      tags:
      - alert-rules-controller
      x-argos-audit: RULE_DELETED
      x-argos-role: operator
    get:
      description: The rule, its 20 newest versions (alert_rule_history) and, when its template has a newer version than the rule was made from, the differing fields (F-S24).
      operationId: alerts_rules_get
      parameters:
      - in: path
        name: ruleId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeAlertRuleDetail'
          description: OK
      summary: One alert rule
      tags:
      - alert-rules-controller
      x-argos-limits:
        rows_max: 20
      x-argos-role: viewer
      x-argos-source:
      - postgres:alert_rules
      - postgres:alert_rule_history
    put:
      description: The whole rule (read-only fields such as rule_id and version are ignored). Channels are chosen by id; a channel's URL never changes here.
      operationId: alerts_rules_update
      parameters:
      - in: path
        name: ruleId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRuleRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeAlertRule'
          description: OK
      summary: Replace an alert rule
      tags:
      - alert-rules-controller
      x-argos-audit: RULE_UPDATED
      x-argos-role: operator
  /api/v1/alerts/rules/{ruleId}/clone:
    post:
      description: A copy of the rule for another application and environment (not server rules).
      operationId: alerts_rules_clone
      parameters:
      - in: path
        name: ruleId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRuleCloneRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeAlertRule'
          description: Created
      summary: Clone an alert rule
      tags:
      - alert-rules-controller
      x-argos-audit: RULE_CREATED
      x-argos-role: operator
  /api/v1/alerts/rules/{ruleId}/disable:
    post:
      operationId: alerts_rules_disable
      parameters:
      - in: path
        name: ruleId
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
      summary: Disable an alert rule
      tags:
      - alert-rules-controller
      x-argos-audit: RULE_DISABLED
      x-argos-role: operator
  /api/v1/alerts/rules/{ruleId}/enable:
    post:
      operationId: alerts_rules_enable
      parameters:
      - in: path
        name: ruleId
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
      summary: Enable an alert rule
      tags:
      - alert-rules-controller
      x-argos-audit: RULE_UPDATED
      x-argos-role: operator
  /api/v1/alerts/stats:
    get:
      description: 'Per rule over the last days (7 or 30): firings (FIRING transitions from a state that was not firing), the average firing duration of the resolved alerts, the average time from the firing to the acknowledgement and to the resolution, most firings first, at most 1,000 rules (finding noisy rules).'
      operationId: alerts_stats_get
      parameters:
      - description: 7 (default) or 30
        in: query
        name: days
        required: false
        schema:
          format: int32
          type: integer
      - description: Application id
        in: query
        name: app
        required: false
        schema:
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeListAlertRuleStats'
          description: OK
      summary: Alert statistics per rule
      tags:
      - alert-events-controller
      x-argos-limits:
        range_max: 30d
        rows_max: 1000
        timeout_s: 10
      x-argos-role: viewer
      x-argos-source:
      - postgres:alert_events
      - postgres:alert_rules
  /api/v1/alerts/templates:
    get:
      description: 'The 14 templates of 01 Appendix A with their version and the rules they create (scope app: per application; server: once for the server).'
      operationId: alerts_templates_list
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeListAlertTemplate'
          description: OK
      summary: Default alert templates
      tags:
      - alert-rules-controller
      x-argos-role: viewer
      x-argos-source:
      - memory:templates
  /api/v1/alerts/templates/apply:
    post:
      description: 'Creates the application rules of the templates (default: every application template) for the application; a template whose rule exists (deleted ones included), a server template, an unknown key and, without keys, the batch template of an application without BATCH transactions are skipped with the reason.'
      operationId: alerts_templates_apply
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertTemplatesApplyRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeAlertTemplatesApplied'
          description: OK
      summary: Apply default templates
      tags:
      - alert-rules-controller
      x-argos-audit: RULE_CREATED
      x-argos-role: operator
  /api/v1/apps:
    get:
      description: 'At most 500 applications by name (meta.truncated when there are more). q is a case-insensitive substring of the name (at most 1 KB). Instance state (12 §4.2): UP while heartbeats arrive, STALE after 60 s without a heartbeat, DOWN after 180 s without one, 5 minutes after the agent''s shutdown message without a reconnect, or when never connected since the server started; WARN while up with a clock offset of 1 s or more, drops in the last 5 minutes, the lowest accepted agent version, a disabled module, the kill switch on, a configuration hash that differs from the application''s majority or a leaked-context count in the last 5 minutes. instances_up counts the instances in UP or WARN.'
      operationId: apps_list
      parameters:
      - in: query
        name: env
        required: false
        schema:
          type: string
      - in: query
        name: group
        required: false
        schema:
          type: string
      - in: query
        name: q
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEnvelopeListApp'
          description: OK
      summary: Applications
      tags:
      - apps-controller
      x-argos-limits:
        rows_max: 500
      x-argos-role: viewer
      x-argos-source:
      - postgres:apps
      - postgres:instances
      - memory:sessions
  /api/v1/apps/{appId}:
    get:
      description: '404 not_found for an unknown application. kinds lists the transaction kinds recorded in the last 7 days (service_stat_1h; null when ClickHouse cannot answer). Instance state (12 §4.2): UP while heartbeats arrive, STALE after 60 s without a heartbeat, DOWN after 180 s without one, 5 minutes after the agent''s shutdown message without a reconnect, or when never connected since the server started; WARN while up with a clock offset of 1 s or more, drops in the last 5 minutes, the lowest accepted agent version, a disabled module, the kill switch on, a configuration hash that differs from the application''s majority or a leaked-context count in the last 5 minutes. instances_up counts the instances in UP or WARN.'
      operationId: apps_get
      parameters:
      - in: path
        name: appId
        required: true
        schema:
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEnvelopeApp'
          description: OK
      summary: An application with its settings summary
      tags:
      - apps-controller
      x-argos-limits:
        timeout_s: 5
      x-argos-role: viewer
      x-argos-source:
      - postgres:apps
      - postgres:instances
      - memory:sessions
      - service_stat_1h
  /api/v1/apps/{appId}/active:
    get:
      description: The latest 5-second snapshot of every live agent session (memory). At most 2,000 items, longest first (meta.truncated). per_instance lists only the instances with a live session, each with its instance state (UP, WARN, STALE, DOWN) as in GET /apps/{appId}/instances.
      operationId: active_get
      parameters:
      - in: path
        name: appId
        required: true
        schema:
          format: int32
          type: integer
      - description: Instances, repeatable, at most 100
        in: query
        name: instance
        required: false
        schema:
          items:
            format: int32
            type: integer
          type: array
      - description: HTTP (default), BATCH, MESSAGE, ALL
        in: query
        name: kind
        required: false
        schema:
          type: string
      - description: SQL, HTTP, DBC, METHOD, ASYNC
        in: query
        name: state
        required: false
        schema:
          type: string
      - in: query
        name: min_elapsed_ms
        required: false
        schema:
          format: int64
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEnvelopeActiveTransactions'
          description: OK
      summary: Running transactions of an application
      tags:
      - active-controller
      x-argos-limits:
        rows_max: 2000
      x-argos-role: viewer
      x-argos-source:
      - memory:active_snapshots
      - postgres:dictionary
  /api/v1/apps/{appId}/collection-health:
    get:
      description: 'Per bucket of [from, to) (source rule of 14 §3, at most 1 year): agent drops (argos_agent_dropped_total), excluded transactions (argos_agent_ignored_total, by reason), the server''s own drop and ingest lag series (server-wide, recorded by WO-28; null before), late rows (ranges up to 24 h), the clock offsets of the live instances (null unless the range ends in the last 2 minutes), the collection outages from state events (D-18) and per-instance totals. A value without a source is null, never 0.'
      operationId: collection_health_get
      parameters:
      - in: path
        name: appId
        required: true
        schema:
          format: int32
          type: integer
      - in: query
        name: from
        required: true
        schema:
          type: string
      - in: query
        name: to
        required: true
        schema:
          type: string
      - in: query
        name: step
        required: false
        schema:
