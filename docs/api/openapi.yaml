  /api/v1/apps/{appId}/sql/{sqlId}:
    get:
      description: The statement's text (sql_normalized at most 2 KB, sql_text at most 64 KB), series (percentiles estimated, C-14) and targets of [from, to) from sql_stat_*; the services and related transactions (xlog.sql_ids, A-10) and instances (sql_stat_raw) of raw_window. wait_ms_total is not measured (no per-statement attribution of pool wait yet; ADR-0010 C-178), always null. 404 for an unknown key. meta.source follows the source rule of 14 §3 (at most 1 year). 64-bit ids (service_id, sql_id, db_id, host_id, group_id, version_id) are unsigned decimal strings.
      operationId: sql_get
      parameters:
      - in: path
        name: appId
        required: true
        schema:
          format: int32
          type: integer
      - description: SQL key (unsigned decimal)
        in: path
        name: sqlId
        required: true
        schema:
          pattern: ^[0-9]{1,20}$
          type: string
      - in: query
        name: from
        required: true
        schema:
          type: string
      - in: query
        name: to
        required: true
        schema:
          type: string
      - in: query
        name: kind
        required: false
        schema:
          type: string
      - in: query
        name: step
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
