    get:
      description: 'The series named by names (stored names with labels, as metrics/names lists them; 1 to 50, each at most 256 bytes) on the time grid of [from, to) by the source rule of 14 §3 (meta.source; at most 1 year, 720 buckets, so at most 2,000 points per series). Gauges: bucket average, min and max; counters: the increase in the bucket. A bucket without samples is null, never 0 (D-09).'
      operationId: metrics_get
      parameters:
      - in: path
        name: instanceId
        required: true
        schema:
          format: int32
          type: integer
      - description: Series names with labels, 1 to 50
        in: query
