      - in: query
        name: from
        required: true
        schema:
          type: string
      - in: query
        name: to
        required: true
        schema:
          type: string
      - description: 10s, 30s, 1m, 5m, 15m, 30m, 1h, 3h, 6h, 12h or 1d
        in: query
        name: step
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEnvelopeInstanceMetrics'
          description: OK
      summary: Metric series of an instance
      tags:
      - metrics-controller
      x-argos-limits:
        range_max: 1y
        rows_max: 2000
        timeout_s: 10
      x-argos-role: viewer
      x-argos-source:
      - metric
