# SPDX-License-Identifier: Apache-2.0
#
# Argos REST API v1. Generated by ./gradlew :server:generateOpenApi from the server's controllers
# (ADR-0003 C-28); do not edit by hand: the contract test fails when this file differs from a
# fresh generation.
openapi: 3.1.0
info:
  title: Argos API
  version: v1
servers:
- url: /
paths:
  /api/v1/about:
    get:
      description: version and commit of the server build (the UI has the server's version), the agent protocol version, the agent versions of the instances that are not archived with their counts (most common first, at most 1,000; a null version is an agent that reported none), whole seconds since the server started and the repository document of the support policy.
      operationId: about_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeAbout'
          description: OK
      summary: Server version, protocol version, agent versions in use and uptime
      tags:
      - about-controller
      x-argos-limits:
        rows_max: 1000
        timeout_s: 5
      x-argos-role: viewer
      x-argos-source:
      - postgres:instances
      - postgres:apps
      - memory:build_info
  /api/v1/about/licenses:
    get:
      description: Per part (server, ui, agent) the components of this build with their version and license, by name. A build without the generated list answers available=false, reason=not_generated (reason=unreadable for a list of the wrong form); at most 5,000 components per part (truncated). Read from the build, no network.
      operationId: about_licenses_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeAboutLicenses'
          description: OK
      summary: Open-source components of the server, the UI and the agent
      tags:
      - about-controller
      x-argos-role: viewer
      x-argos-source:
      - memory:build_resources
  /api/v1/admin/apps/{appId}/config:
    get:
      description: 'remote_allowed_keys: the agent keys every instance''s remote-config.allow names; remote_allowed_by_instance: each instance''s list (the live session''s, else its last Hello''s); current: the values the server holds for the app (pushed to connected instances, sent to the others in their next ServerHello.config; secret-like values ****); drift: instances whose configuration hash differs from the app''s majority (key null) and server-held values an instance does not run (not_allowed, rejected, pending).'
      operationId: admin_config_get
      parameters:
      - in: path
        name: appId
        required: true
        schema:
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeAppConfig'
          description: OK
      summary: An app's pushed configuration
      tags:
      - config-controller
      x-argos-limits:
        timeout_s: 10
      x-argos-role: admin
      x-argos-source:
      - postgres:app_config
      - postgres:config_change_results
      - memory:sessions
  /api/v1/admin/apps/{appId}/config/changes:
    get:
      description: Newest first (limit default 50, at most 100); the next page with cursor = meta.next_cursor.
      operationId: admin_config_changes_list
      parameters:
      - in: path
        name: appId
        required: true
        schema:
          format: int32
          type: integer
      - description: meta.next_cursor of the previous page
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: Rows, at most 100 (default 50)
        in: query
        name: limit
        required: false
        schema:
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEnvelopeListConfigChange'
          description: OK
      summary: An app's configuration changes
      tags:
      - config-controller
      x-argos-limits:
        rows_max: 100
        timeout_s: 10
      x-argos-role: admin
      x-argos-source:
      - postgres:config_changes
      - postgres:config_change_results
    post:
      description: 'Stores a preview: reason (required, at most 1 KiB), changes {key: value} (agent keys of docs/agent-config.md in dotted form, at most 64; null removes the server-held value), targets {all: true} (default) or {instance_ids} (at most 100). 400 for an unknown or immutable key (server.*, remote-config.*, app.*, log.dir, keys whose Remote column is -), an invalid value, a mask pattern list that drops a held pattern (reduce_masking) or the kill switch key (use /kill-switch). 422 remote_key_not_allowed for a key no target''s remote-config.allow names (details: the key not_allowed_by_targets and every target not_allowed). A key only some targets allow is listed per instance in preview.rejected_keys_by_instance and is never pushed to them. Apply with POST /admin/config/changes/{changeId}/apply.'
      operationId: admin_config_changes_create
      parameters:
      - in: path
        name: appId
        required: true
        schema:
          format: int32
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigChangeRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeConfigChange'
          description: Created
      summary: Propose a configuration change
      tags:
      - config-controller
      x-argos-audit: CONFIG_CHANGE_CREATED
      x-argos-limits:
        timeout_s: 10
      x-argos-role: admin
      x-argos-source:
      - postgres:config_changes
      - postgres:app_config
      - postgres:instances
  /api/v1/admin/apps/{appId}/kill-switch:
    post:
      description: 'enabled = false makes every instrumentation point of the targeted agents a no-op at once (metrics and the session stay), true turns it back on: a configuration change of the agent key enabled (argos.enabled), proposed and applied in one call, with the same per-instance results (GET /admin/config/changes/{changeId}). reason required; instance_ids null or empty for every instance. 400 when no target''s remote-config.allow names enabled.'
      operationId: admin_kill_switch
      parameters:
      - in: path
        name: appId
        required: true
        schema:
          format: int32
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KillSwitchRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeConfigChange'
          description: Accepted
      summary: Turn the kill switch on or off
      tags:
      - config-controller
      x-argos-audit: KILL_SWITCH,CONFIG_CHANGE_CREATED
      x-argos-limits:
        timeout_s: 30
      x-argos-role: admin
      x-argos-source:
      - postgres:config_changes
      - postgres:config_change_results
      - memory:sessions
  /api/v1/admin/apps/{appId}/tokens:
    get:
      operationId: tokens_list
      parameters:
      - in: path
        name: appId
        required: true
        schema:
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeListAgentTokenView'
          description: OK
      tags:
      - tokens-controller
      x-argos-role: admin
    post:
      operationId: tokens_issue
      parameters:
      - in: path
        name: appId
        required: true
        schema:
          format: int32
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueTokenRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeIssuedTokenResponse'
          description: Created
      tags:
      - tokens-controller
      x-argos-audit: TOKEN_ISSUED
      x-argos-role: admin
  /api/v1/admin/audit:
    get:
      description: 'The audit records of [from, to) (at most 366 days), newest first. actor matches the actor id or name exactly; action is a 16 §11.1 event name; target_type and target_id match exactly. Pages of limit (default 100, at most 500) continue with cursor = meta.next_cursor. Read only: the log cannot be changed through the API. Every call is recorded as AUDIT_LOG_VIEWED.'
      operationId: admin_audit_list
      parameters:
      - in: query
        name: from
        required: true
        schema:
          type: string
      - in: query
        name: to
        required: true
        schema:
          type: string
      - description: Actor id or name (exact)
        in: query
        name: actor
        required: false
        schema:
          type: string
      - description: Event name (16 §11.1)
        in: query
        name: action
        required: false
        schema:
          type: string
      - in: query
        name: target_type
        required: false
        schema:
          type: string
      - in: query
        name: target_id
        required: false
        schema:
          type: string
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: Rows of a page, at most 500 (default 100)
        in: query
        name: limit
        required: false
        schema:
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEnvelopeListAuditRecord'
          description: OK
      summary: Audit log
      tags:
      - audit-controller
      x-argos-audit: AUDIT_LOG_VIEWED
      x-argos-limits:
        range_max: 366d
        rows_max: 500
        timeout_s: 10
      x-argos-role: admin
      x-argos-source:
      - postgres:audit_logs
  /api/v1/admin/audit/export:
    get:
      description: 'The records of the same filters as GET /admin/audit as CSV (16 §9.6: UTF-8 with BOM, every cell quoted, formula prefix), newest first, at most 10,000 rows (400 limit_exceeded with format/too_many_rows above: narrow the range). format is csv (the default). tz: IANA time zone of the times (UTC without). At most 10 exports a minute per user. Recorded as AUDIT_LOG_EXPORTED.'
      operationId: admin_audit_export
      parameters:
      - in: query
        name: from
        required: true
        schema:
          type: string
      - in: query
        name: to
        required: true
        schema:
          type: string
      - in: query
        name: actor
        required: false
        schema:
          type: string
      - in: query
        name: action
        required: false
        schema:
          type: string
      - in: query
        name: target_type
        required: false
        schema:
          type: string
      - in: query
        name: target_id
        required: false
        schema:
          type: string
      - description: csv (the default)
        in: query
        name: format
        required: false
        schema:
          enum:
          - json
          - csv
          type: string
      - description: IANA time zone of the CSV times
        in: query
        name: tz
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            text/csv:
              schema:
                type: string
          description: The CSV file
      summary: Export the audit log
      tags:
      - audit-controller
      x-argos-audit: AUDIT_LOG_EXPORTED
      x-argos-csv: true
      x-argos-limits:
        range_max: 366d
        rows_max: 10000
        timeout_s: 10
      x-argos-role: admin
      x-argos-source:
      - postgres:audit_logs
  /api/v1/admin/config/changes/{changeId}:
    get:
      description: 'The change (status previewed, applying, applied, superseded) with its diff and, per target, status applied, partial, rejected (with rejected keys: by server = outside its remote-config.allow, never pushed; by agent = the agent''s ConfigApplyResult), offline or pending.'
      operationId: admin_config_changes_get
      parameters:
      - in: path
        name: changeId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeConfigChange'
          description: OK
      summary: A configuration change and its results
      tags:
      - config-controller
      x-argos-limits:
        timeout_s: 10
      x-argos-role: admin
      x-argos-source:
      - postgres:config_changes
      - postgres:config_change_results
  /api/v1/admin/config/changes/{changeId}/apply:
    post:
      description: Stores the values as the app's server-held configuration and pushes them to every connected target (only the keys its remote-config.allow names); targets that are not connected are pending and get the values in their next ServerHello.config. Results arrive within seconds (GET /admin/config/changes/{changeId}, WebSocket topic admin); a push without an answer within 30 s is offline. 409 invalid_state when the change is not a preview (applied, superseded).
      operationId: admin_config_changes_apply
      parameters:
      - in: path
        name: changeId
        required: true
        schema:
          type: string
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeConfigChange'
          description: Accepted
      summary: Apply a configuration change
      tags:
      - config-controller
      x-argos-audit: CONFIG_PUSH,KILL_SWITCH
      x-argos-limits:
        timeout_s: 30
      x-argos-role: admin
      x-argos-source:
      - postgres:config_changes
      - postgres:config_change_results
      - memory:sessions
  /api/v1/admin/config/changes/{changeId}/revert:
    post:
      description: 'Creates and applies at once a change (revert_of) of the values the server held before the change, for its keys and targets (ConfigPush.revert = true). A key the server held no value for is removed from the server-held configuration and not pushed: the agent keeps the pushed value until its restart or reload_config. 409 invalid_state when the change was not applied.'
      operationId: admin_config_changes_revert
      parameters:
      - in: path
        name: changeId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigRevertRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeConfigChange'
          description: Created
      summary: Revert a configuration change
      tags:
      - config-controller
      x-argos-audit: CONFIG_ROLLBACK,CONFIG_PUSH,KILL_SWITCH
      x-argos-limits:
        timeout_s: 30
      x-argos-role: admin
      x-argos-source:
      - postgres:config_changes
      - postgres:config_change_results
      - memory:sessions
  /api/v1/admin/pending-registrations:
    get:
      description: 'Hellos of an application (name, env) that the server did not register automatically (12 §4.4: its environment does not register automatically, or the token''s home application has 8 automatic variants), most recently attempted first, at most 1,000. env filters by environment.'
      operationId: admin_pending_registrations_list
      parameters:
      - in: query
        name: env
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeListPendingRegistration'
          description: OK
      summary: Queued registration requests
      tags:
      - pending-registrations-controller
      x-argos-limits:
        rows_max: 1000
      x-argos-role: admin
      x-argos-source:
      - postgres:pending_registrations
  /api/v1/admin/pending-registrations/{id}/approve:
    post:
      description: 'Creates the application as an environment variant of the token''s home application (the home application''s agents are accepted on their next retry), applies group and apdex_t_ms and issues one agent token of the new application, returned in this response only. 404 for an unknown request, 409 already_exists when (name, env) belongs to another application, 409 invalid_state when the request has no home application. 409 invalid_state with the details approval: applied, token: not_issued and app_id: token_limit when the application has 5 active tokens already: the approval stays applied (the request is gone, the application exists) and no token is issued; issue one with POST /admin/apps/{appId}/tokens after revoking another.'
      operationId: admin_pending_registrations_approve
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: int32
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveRegistrationRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeApprovedRegistration'
          description: Created
      summary: Approve a registration request
      tags:
      - pending-registrations-controller
      x-argos-audit: APP_APPROVED,TOKEN_ISSUED
      x-argos-role: admin
  /api/v1/admin/pending-registrations/{id}/reject:
    post:
      description: Deletes the request; the agent's next retry queues it again (12 §4.4 keeps no deny list). 404 for an unknown request.
      operationId: admin_pending_registrations_reject
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: int32
          type: integer
      responses:
        '204':
          description: No Content
      summary: Reject a registration request
      tags:
      - pending-registrations-controller
      x-argos-audit: APP_REJECTED
      x-argos-role: admin
  /api/v1/admin/privacy/deletions:
    post:
      description: Exactly one of user_id and ip, in the request body only (never in the URL, SEC-33). Queues a job (GET /admin/privacy/jobs/{jobId}); rollups are not changed. 5 requests per user and hour.
      operationId: privacy_delete
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeletionRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeDeletionAccepted'
          description: Accepted
      summary: Delete the transactions of a user id or a client address
      tags:
      - privacy-controller
      x-argos-audit: PRIVACY_DELETE_REQUESTED
      x-argos-limits:
        range_max: 30d
      x-argos-role: admin
  /api/v1/admin/privacy/jobs/{jobId}:
    get:
      operationId: privacy_job
      parameters:
      - in: path
        name: jobId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopePrivacyJobView'
          description: OK
      summary: The state of a privacy deletion job
      tags:
      - privacy-controller
      x-argos-role: admin
  /api/v1/admin/settings/privacy:
    get:
      operationId: settings_privacy
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopePrivacySettingsView'
          description: OK
      summary: The server's privacy defaults
      tags:
      - settings-controller
      x-argos-role: admin
    put:
      description: Agents with a local capture.remote-ip keep theirs; nothing is pushed.
      operationId: settings_update_privacy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivacySettingsRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopePrivacySettingsView'
          description: OK
      summary: Change the server's default IP mode
      tags:
      - settings-controller
      x-argos-audit: PRIVACY_SETTING_CHANGED
      x-argos-role: admin
  /api/v1/admin/settings/retention:
    get:
      operationId: settings_retention
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeRetentionView'
          description: OK
      summary: The effective data retention and the ClickHouse tables' TTL
      tags:
      - settings-controller
      x-argos-role: admin
    put:
      description: 'Absent fields keep their value. A shorter value needs confirm: true; data outside it is dropped.'
      operationId: settings_update_retention
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetentionUpdateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeRetentionUpdated'
          description: OK
      summary: Change the data retention
      tags:
      - settings-controller
      x-argos-audit: RETENTION_CHANGED
      x-argos-role: admin
  /api/v1/admin/storage/health:
    get:
      description: ClickHouse disks, the partitions with the most active parts, merges, insert health counters, mutations (system tables read as argos_reader), the server's WAL and unresolved dictionary ids; from the storage health job the last TTL run it saw (null before one), whether the emergency retention is on (null before its first run) and the writer's dead-letter area.
      operationId: storage_health_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEnvelopeStorageHealth'
          description: OK
      summary: Storage health
      tags:
      - health-controller
      x-argos-limits:
        timeout_s: 10
      x-argos-role: operator
      x-argos-source:
      - system.parts
      - system.merges
      - system.events
      - system.disks
      - system.mutations
      - memory:meters
  /api/v1/admin/tls/reload:
    post:
      operationId: admin_tls_reload
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeTlsReloadView'
          description: OK
      tags:
      - tls-controller
      x-argos-audit: TLS_RELOADED
      x-argos-role: admin
  /api/v1/admin/tokens/{tokenId}/revoke:
    post:
      operationId: tokens_revoke
      parameters:
      - in: path
        name: tokenId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeTokenRequest'
      responses:
        '204':
          description: No Content
      tags:
      - tokens-controller
      x-argos-audit: TOKEN_REVOKED
      x-argos-role: admin
  /api/v1/admin/tokens/{tokenId}/rotate:
    post:
      operationId: tokens_rotate
      parameters:
      - in: path
        name: tokenId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateTokenRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeIssuedTokenResponse'
          description: Created
      tags:
      - tokens-controller
      x-argos-audit: TOKEN_ROTATED,TOKEN_ISSUED
      x-argos-role: admin
  /api/v1/admin/users:
    get:
      operationId: admin_users_list
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeListAdminUserView'
          description: OK
      tags:
      - admin-users-controller
      x-argos-role: admin
    post:
      operationId: admin_users_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeCreateUserResponse'
          description: Created
      tags:
      - admin-users-controller
      x-argos-audit: USER_CREATED
      x-argos-role: admin
  /api/v1/admin/users/{id}:
    delete:
      description: The account is anonymised and disabled (the user name becomes free again), every session of it ends at once (401 session_revoked on its next request) and the audit log keeps its old name. 409 invalid_state for the caller's own account (detail self) or the last enabled administrator (detail last_admin).
      operationId: admin_users_delete
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
      summary: Delete a user
      tags:
      - admin-users-controller
      x-argos-audit: USER_DELETED,SESSION_REVOKED
      x-argos-role: admin
    patch:
      operationId: admin_users_patch
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchUserRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeAdminUserView'
          description: OK
      tags:
      - admin-users-controller
      x-argos-audit: USER_UPDATED,ROLE_CHANGED,USER_DISABLED,SESSION_REVOKED
      x-argos-role: admin
  /api/v1/admin/users/{id}/password/reset:
    post:
      operationId: admin_users_reset_password
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
