      summary: Summary of a dragged XLog rectangle
      tags:
      - xlog-controller
      x-argos-audit: none
      x-argos-limits:
        range_max: 24h
        timeout_s: 10
      x-argos-role: viewer
      x-argos-source:
      - xlog
      - postgres:dictionary
      - postgres:instances
