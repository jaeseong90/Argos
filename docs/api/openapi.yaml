      - description: HTTP (default), BATCH, MESSAGE or ALL
        in: query
        name: kind
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEnvelopeOverview'
          description: OK
      summary: Overview of every application
      tags:
      - overview-controller
      x-argos-limits:
        rows_max: 500
        timeout_s: 10
      x-argos-role: viewer
      x-argos-source:
      - xlog
      - app_stat_1m
      - postgres:apps
      - postgres:instances
      - postgres:events
      - postgres:notification_deliveries
      - memory:sessions
      - memory:alerts
  /api/v1/overview/alerts:
    get:
      description: 'The active (FIRING and ACKED) alerts of every application and of the server itself, newest first, at most 1,000 (meta.truncated beyond): the 14 §4.13 event schema subset of the alert engine''s current state (ADR-0010 C-212 (2)). event_id is the FIRING event of the current firing (the acknowledgement target and the deep link''s alert); duration_s counts from the firing to now. env keeps that environment''s application alerts and the server self alerts.'
      operationId: overview_alerts_list
      parameters:
      - in: query
        name: env
        required: false
        schema:
          type: string
      - description: critical or warn
        in: query
        name: severity
        required: false
        schema:
          type: string
      - description: FIRING or ACKED
        in: query
        name: state
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEnvelopeListAlertEventItem'
          description: OK
      summary: Firing and acknowledged alerts of every application
      tags:
      - overview-controller
      x-argos-limits:
        rows_max: 1000
      x-argos-role: viewer
      x-argos-source:
      - memory:alerts
  /api/v1/search:
    get:
      description: 'type=auto: 15-20 digits whose time is not in the future are a transaction id (an id counts from 2026-01-01: 18 digits in 2026), 32 hex digits a trace id, anything else text (services, SQL, instances; at least 3 characters). type=tx takes any unsigned 64-bit decimal. user and request searches need from and to (at most 24 h); user ids match plain-mode rows and, with app_id, hashed-mode rows by the application''s salted HMAC of the id (16 §6.3; 422 user_id_hash_unavailable only when a hashed-only application''s salt cannot be read). q is at most 1 KB. Heavy bucket: 10 a minute.'
      operationId: search_find
      parameters:
      - description: The searched text, at most 1 KB
        in: query
        name: q
        required: true
        schema:
          type: string
      - description: auto (default), tx, trace, user, request, service, sql, instance
        in: query
        name: type
        required: false
        schema:
          enum:
          - auto
          - tx
          - trace
          - user
          - request
          - service
          - sql
          - instance
          type: string
      - description: Restrict to an application
        in: query
        name: app
        required: false
        schema:
          format: int32
          type: integer
      - description: Restrict to an environment
        in: query
        name: env
        required: false
        schema:
          type: string
      - in: query
        name: from
        required: false
        schema:
          type: string
      - in: query
        name: to
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEnvelopeSearchResult'
          description: OK
      summary: Find transactions, traces, services, SQL and instances
      tags:
      - search-controller
      x-argos-limits:
        range_max: 24h
        rows_max: 100
        timeout_s: 10
      x-argos-role: viewer
      x-argos-source:
      - xlog
      - postgres:dictionary
      - postgres:instances
  /api/v1/server/health:
    get:
      description: 'The data.server block of the overview: current ingest lag (p99, null before the first insert), the largest used ratio of the server''s disks (WAL file system and ClickHouse disks), the notification deliveries that failed in the last 24 h (null only while PostgreSQL cannot be read), live agent sessions and the whole days until the collector''s TLS certificate expires (null without TLS).'
      operationId: server_health_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEnvelopeServerHealth'
          description: OK
      summary: Server summary
      tags:
      - health-controller
      x-argos-limits:
        timeout_s: 10
      x-argos-role: viewer
      x-argos-source:
      - memory:meters
      - memory:sessions
      - postgres:notification_deliveries
  /api/v1/setup/admin:
    post:
      operationId: setup_create_admin
      parameters:
      - in: header
        name: X-Argos-Setup-Token
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupAdminRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeSetupAdminResponse'
          description: Created
      tags:
      - setup-controller
      x-argos-audit: SETUP_COMPLETED,USER_CREATED,LOGIN_SUCCESS
      x-argos-role: public
  /api/v1/setup/status:
    get:
      operationId: setup_status
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeSetupStatusResponse'
          description: OK
      tags:
      - setup-controller
      x-argos-role: public
  /api/v1/traces/{traceId}:
    get:
      description: 'Searched range: window (1h, 24h, 7d, 30d until now; 30d counts against the heavy bucket, 10 a minute), else ?ts +-1 h, else the time in an Argos-generated id +-1 h (then 24 h when nothing is there), else the last 24 h. At most 500 transactions (meta.truncated). meta.retention_exceeded is true when the searched range starts before the raw retention (argos.retention.xlog). 404 not_found (trace_id/not_in_window) when the range holds none.'
      operationId: traces_get
      parameters:
      - in: path
        name: traceId
        required: true
        schema:
          type: string
      - description: 'A time of the trace (ISO-8601 UTC): search +-1 h around it'
        in: query
        name: ts
        required: false
        schema:
          type: string
      - description: 1h, 24h, 7d or 30d until now
        in: query
        name: window
        required: false
        schema:
          enum:
          - 1h
          - 24h
          - 7d
          - 30d
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEnvelopeTrace'
          description: OK
      summary: A distributed trace
      tags:
      - traces-controller
      x-argos-limits:
        range_max: 30d
        rows_max: 500
        timeout_s: 10
      x-argos-role: viewer
      x-argos-source:
      - xlog
      - profile_step
      - postgres:dictionary
      - postgres:apps
  /api/v1/transactions/{txId}:
    get:
      description: 'Lookup order (ADR-0007 C-50, ADR-0010 C-150): ?ts +-2 s, then the time in the id +-2 s, then the day of that time and the day before; otherwise 404 not_found with details [{field: tx_id, reason: clock_skew_possible}]: open the transaction from a list or with ?ts. Bind parameters of a full-mode instance are shown only to an administrator with pii.view (audited as SENSITIVE_VIEW); everyone else gets their type and length (params_mode masked_by_role).'
      operationId: transactions_get
      parameters:
      - in: path
        name: txId
        required: true
        schema:
          pattern: ^[0-9]{1,20}$
          type: string
      - description: The transaction's start (ISO-8601 UTC), e.g. from a list
        in: query
        name: ts
        required: false
        schema:
          type: string
      - description: Application hint
        in: query
        name: app
        required: false
        schema:
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEnvelopeTransactionDetail'
          description: OK
      summary: A transaction with its profile
      tags:
      - transactions-controller
      x-argos-audit: SENSITIVE_VIEW
      x-argos-limits:
        timeout_s: 10
      x-argos-pii: view
      x-argos-role: viewer
      x-argos-source:
      - xlog
      - profile_step
      - postgres:dictionary
      - postgres:apps
      - postgres:instances
  /api/v1/transactions/{txId}/baseline:
    get:
      description: service_stat_1m within +-30 minutes (p50, p95), the transaction's rank among the service's transactions and a normal sample of the same service (the same instance first). The transaction is found as by transactions_get.
      operationId: transactions_baseline
      parameters:
      - in: path
        name: txId
        required: true
        schema:
          pattern: ^[0-9]{1,20}$
          type: string
      - in: query
        name: ts
        required: false
        schema:
          type: string
      - in: query
        name: app
        required: false
        schema:
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEnvelopeTransactionBaseline'
          description: OK
      summary: The service baseline around a transaction
      tags:
      - transactions-controller
      x-argos-limits:
        timeout_s: 10
      x-argos-role: viewer
      x-argos-source:
      - xlog
      - service_stat_1m
  /api/v1/transactions/{txId}/export:
    get:
      description: The response of transactions_get as an attachment (argos-transaction-<txId>.json); heavy bucket; recorded as EXPORT_CSV (view transaction_detail, format json) and, when full bind parameters are included, SENSITIVE_VIEW.
      operationId: transactions_export
      parameters:
      - in: path
        name: txId
        required: true
        schema:
          pattern: ^[0-9]{1,20}$
          type: string
      - in: query
        name: ts
        required: false
        schema:
          type: string
      - in: query
        name: app
        required: false
        schema:
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEnvelopeTransactionDetail'
          description: OK
      summary: Download a transaction as JSON
      tags:
      - transactions-controller
      x-argos-audit: EXPORT_CSV,SENSITIVE_VIEW
      x-argos-limits:
        timeout_s: 10
      x-argos-pii: view
      x-argos-role: viewer
      x-argos-source:
      - xlog
      - profile_step
      - postgres:dictionary
