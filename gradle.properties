#
# Build settings (docs/19-repo-build-release-design.md §3.1).

org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Single SemVer for agent, server and UI (DSN-19-10). Tag builds override it with -Pversion=X.Y.Z.
version=0.0.0-SNAPSHOT
group=io.github.argos-apm

# The protocol version is not set here: the build reads proto/PROTOCOL_VERSION (single source).

# Agent protobuf runtime flavour (A-1, decided in Phase 0 P-3). Only agent projects honour it;
# :proto and :server always generate full protobuf-java code.
argos.proto.lite=false
