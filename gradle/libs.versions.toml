# SPDX-License-Identifier: Apache-2.0
#
# Version catalog: the single source of library and plugin versions (DSN-19-01, 19 §3.1).
# Versions were checked against Maven Central / Gradle Plugin Portal on 2026-10-23.
# Every artifact that ends up in a shipped artifact must be Apache-2.0, MIT, MIT-0, BSD-2/3-Clause,
# ISC, 0BSD, PostgreSQL, Unicode-DFS or CC0-1.0 (O-L03, checked by checkLicenses).
#
# Not in this file: the foojay toolchain resolver plugin (settings.gradle.kts, 1.0.0), because
# version catalogs cannot be used in the settings plugins block.

[versions]
# --- agent runtime (shaded into argos-agent.jar under io.argos.agent.shaded) ---
bytebuddy = "1.18.15"
grpc = "1.85.1"
protobuf = "4.36.2"
netty = "4.2.19.Final"
jctools = "4.0.7"
# --- server runtime ---
spring-boot = "4.1.2"
clickhouse-client = "0.11.0"
postgresql = "42.7.14"
flyway = "13.11.1"
# springdoc 3.x is the Spring Boot 4 line; 3.2.0 is built against Boot 4.1.2. Only the WebMVC API
# starter is used: the runtime OpenAPI document, no Swagger UI webjar (14 §8, §12 #9; WO-24).
springdoc = "3.2.0"
# In-memory token buckets of the API rate limits (16 §7.13, §15 #12; Apache-2.0, no dependencies).
bucket4j = "8.21.0"
# Alert windows: per-second latency histograms of the alert engine (12 §5.2, DSN-12-07; WO-25;
# BSD-2-Clause OR CC0-1.0, no dependencies). The same version Micrometer brings at run time.
hdrhistogram = "2.2.2"
# --- tests ---
# JUnit stays on the 5.x line: JUnit 6 requires Java 17, but agent tests run on Java 8
# (DSN-19-02). Projects that import the Spring Boot BOM get the Boot-managed JUnit version.
junit = "5.14.4"
assertj = "3.27.7"
archunit = "1.5.1"
asm = "9.11.1"
testcontainers = "2.0.5"
# --- agent instrumentation compile-time APIs (compileOnly and module tests, never shipped) ---
# The lowest supported API version of each target, so that a module cannot call a newer method by
# accident; at run time the application's own classes are used (docs/licenses/dev-only.md).
agent-servlet-javax-api = "3.1.0"
# javax.servlet 4.0 for the one Servlet 4 helper (HttpServletMapping) of the servlet module only,
# compiled in its own source set; every other javax helper stays on 3.1 (WO-12).
agent-servlet-javax-api4 = "4.0.1"
agent-servlet-jakarta-api = "5.0.0"
# --- build tools ---
errorprone = "2.51.0"
# 1.37.0 exists but fails inside Spotless 8.10.4 (NoSuchMethodError on
# JavaFormatterOptions$Style.valueOf); 1.36.1 is the version Spotless 8.10.4 is built against.
google-java-format = "1.36.1"
spotless = "8.10.4"
errorprone-plugin = "5.1.1"
shadow = "9.6.1"
cyclonedx = "3.5.1"
license-report = "3.1.4"
jib = "3.5.4"
# Jib's plugin extension API, at the versions jib-gradle-plugin 3.5.4 itself depends on: build-logic
# compiles the server image's directory ownership extension against them (WO-40, ServerImage).
jib-extension-api = "0.4.0"
jib-extension-common = "0.2.0"
jib-build-plan = "0.4.0"
protobuf-plugin = "0.10.0"
maven-publish = "0.37.0"
# --- sample apps (sample-apps/, 18 §4, WO-01) ---
# Development-only: sample apps are not shipped, so their dependencies are checked by
# checkDevOnlyLicenses (docs/licenses/dev-only.md), not by checkLicenses. The exception is
# sample-apps/load, which becomes the public argos-demo-load image; it has no third-party runtime
# dependency (checkDemoLoadDependencies). Library versions not listed here come from the Spring
# Boot BOM of each app (platform dependency).
# 2.7.18 is the last open-source 2.7 release (Java 8, javax, Tomcat 9, Hibernate 5).
sample-boot2 = "4.1.2"
# Last 3.x line (Java 17, jakarta, Tomcat 10.1, Hibernate 6).
sample-boot3 = "4.1.2"
# Java 17 baseline, Framework 7, Tomcat 11; same release as the server (spring-boot above).
sample-boot4 = "4.1.2"
# Spring Cloud release train for Boot 3.5 (shop-heavy).
sample-spring-cloud = "2025.0.3"
# OkHttp per app generation (18 §4.1): 3.x for shop-boot2, 4.x for the jakarta apps.
sample-okhttp3 = "3.14.9"
sample-okhttp4 = "4.12.0"
# Standalone Tomcat binary distributions (zip from Maven Central) for the WAR apps.
sample-tomcat9 = "9.0.123"
sample-tomcat10 = "10.1.61"
sample-tomcat11 = "11.0.27"
# shop-heavy extras (dependency count and class count for N-04/N-27).
sample-springdoc = "2.9.1"
sample-querydsl = "6.12"
sample-poi = "5.5.1"
sample-aws-sdk = "2.57.3"
sample-guava = "33.7.2-jre"
sample-commons-collections4 = "4.5.0"
sample-commons-text = "1.15.0"
sample-mapstruct = "1.6.3"

[libraries]
# agent runtime
bytebuddy = { module = "net.bytebuddy:byte-buddy", version.ref = "bytebuddy" }
grpc-bom = { module = "io.grpc:grpc-bom", version.ref = "grpc" }
grpc-api = { module = "io.grpc:grpc-api", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
grpc-protobuf-lite = { module = "io.grpc:grpc-protobuf-lite", version.ref = "grpc" }
grpc-netty = { module = "io.grpc:grpc-netty", version.ref = "grpc" }
# WO-02 P-3 transport comparison only (test/agent/transport-poc, A-1); not used by shipped modules.
grpc-okhttp = { module = "io.grpc:grpc-okhttp", version.ref = "grpc" }
# Netty 4.1 line for the P-3 ADR-0003 C-22 comparison (Netty 4.2 ships Java 11 class files).
poc-netty41-bom = { module = "io.netty:netty-bom", version = "4.1.139.Final" }
# Netty of the agent transport only (ADR-0009 C-73: 4.1.x >= 4.1.139 keeps C-22, shaded major <= 52;
# enforced in :agent:agent-dist). Never used by the server (its own netty-bom entry, WO-21).
agent-netty-bom = { module = "io.netty:netty-bom", version = "4.1.139.Final" }
grpc-inprocess = { module = "io.grpc:grpc-inprocess", version.ref = "grpc" }
protoc-gen-grpc-java = { module = "io.grpc:protoc-gen-grpc-java", version.ref = "grpc" }
protobuf-bom = { module = "com.google.protobuf:protobuf-bom", version.ref = "protobuf" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
protobuf-javalite = { module = "com.google.protobuf:protobuf-javalite", version.ref = "protobuf" }
protoc = { module = "com.google.protobuf:protoc", version.ref = "protobuf" }
netty-bom = { module = "io.netty:netty-bom", version.ref = "netty" }
jctools-core = { module = "org.jctools:jctools-core", version.ref = "jctools" }
# server runtime
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
clickhouse-client = { module = "com.clickhouse:client-v2", version.ref = "clickhouse-client" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
# Server starters and libraries without a version: managed by spring-boot-bom (WO-20). Boot 4 names
# the servlet web starter spring-boot-starter-webmvc (spring-boot-starter-web is its deprecated
# alias). Logback (spring-boot-starter-logging) and jakarta.annotation-api are excluded by
# argos.java-server (EPL/LGPL, EPL/GPL: ADR-0004 C-43); tomcat-annotations-api (Apache-2.0)
# provides jakarta.annotation instead.
server-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
server-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
server-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
server-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
server-starter-log4j2 = { module = "org.springframework.boot:spring-boot-starter-log4j2" }
# WO-22: WebSocket endpoint /ws (14 §5) and the Reactor sinks of the realtime bus (12 §3.7).
server-starter-websocket = { module = "org.springframework.boot:spring-boot-starter-websocket" }
server-reactor-core = { module = "io.projectreactor:reactor-core" }
server-log4j-layout-template-json = { module = "org.apache.logging.log4j:log4j-layout-template-json" }
server-micrometer-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
server-tomcat-annotations-api = { module = "org.apache.tomcat:tomcat-annotations-api" }
# WO-24: Spring Security (stateless filter chains, BCryptPasswordEncoder) and Caffeine (session
# state cache, rate-limit bucket maps; DSN-12-10) from spring-boot-bom; springdoc runtime spec and
# Bucket4j for JDK 17+ with the versions above.
server-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
server-caffeine = { module = "com.github.ben-manes.caffeine:caffeine" }
server-springdoc-webmvc-api = { module = "org.springdoc:springdoc-openapi-starter-webmvc-api", version.ref = "springdoc" }
server-bucket4j = { module = "com.bucket4j:bucket4j_jdk17-core", version.ref = "bucket4j" }
# WO-25: HdrHistogram of the alert windows (version above).
server-hdrhistogram = { module = "org.hdrhistogram:HdrHistogram", version.ref = "hdrhistogram" }
# Parts of the above used directly by the server test fixtures (ApiTestClient, TestUsers).
server-security-crypto = { module = "org.springframework.security:spring-security-crypto" }
server-jackson-databind = { module = "tools.jackson.core:jackson-databind" }
# Server test modules (Boot 4 splits the test support per technology), versions from spring-boot-bom.
server-test-starter = { module = "org.springframework.boot:spring-boot-starter-test" }
server-test-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
server-test-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator-test" }
# tests
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
