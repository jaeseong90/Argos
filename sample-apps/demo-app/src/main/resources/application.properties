#
# argos-demo-app (WO-41). Settings come from the environment (DemoSettings): DEMO_ROLE, PEER_URL,
# DEMO_DB_URL, DEMO_DB_USER, DEMO_DB_PASSWORD_FILE, DEMO_DB_WAIT, DEMO_BATCH_PERIOD,
# DEMO_BATCH_INITIAL_DELAY.
spring.application.name=argos-demo-app
server.port=8080
server.shutdown=graceful
spring.main.banner-mode=off
spring.jmx.enabled=false
# PEER_URL (17 §3.2 compose variable) without the DEMO_ prefix; DEMO_PEER_URL also works.
demo.peer-url=${PEER_URL:}
# The demo raises exceptions on purpose (GET /api/error-500, declined payments: several per second
# under the demo load). Argos records them; Tomcat's per-request stack trace in the container log
# would only fill the disk.
logging.level.org.apache.catalina.core.ContainerBase=off
logging.level.io.argos.sample.demo=info
