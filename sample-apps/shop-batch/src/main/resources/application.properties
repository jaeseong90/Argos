# shop-batch settings. Switches come from the environment (sample-apps/README.md, common
# SampleConfig); the one DataSource is built by common (SampleDataSources) and shared by the shop
# data, this app's tables, the Spring Batch metadata and the Quartz job store.
spring.application.name=${SAMPLE_APP_NAME:shop-batch}
server.port=${SERVER_PORT:8080}
# SAMPLE_VT=true: virtual threads for Tomcat, @Scheduled and the task executor (Boot 3.2+, JDK 21+).
spring.threads.virtual.enabled=${SAMPLE_VT:false}
spring.main.banner-mode=off
server.shutdown=immediate
spring.sql.init.mode=never
server.error.include-message=always
management.endpoints.web.exposure.include=health
logging.pattern.level=%5p [%X]

# Spring Batch: metadata tables in the shared DataSource (created if missing); jobs run on demand
# only (POST /batch/run/{job}), never at startup.
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

# Quartz: JDBC job store in the shared DataSource (tables created if missing), jobs and triggers
# from QuartzJobsConfiguration (stored again at every start).
spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=always
spring.quartz.overwrite-existing-jobs=true
spring.quartz.scheduler-name=shop-batch
spring.quartz.wait-for-jobs-to-complete-on-shutdown=false
spring.quartz.properties.org.quartz.threadPool.threadCount=4
spring.quartz.properties.org.quartz.jobStore.misfireThreshold=60000
# Quartz job 1 (order report): cron SAMPLE_BATCH_QUARTZ_REPORT_CRON (Quartz syntax), default every
# 30 s. Quartz job 2 (report cleanup): every SAMPLE_BATCH_QUARTZ_CLEANUP_MS, default 60 s.
sample.batch.quartz.report-cron=${SAMPLE_BATCH_QUARTZ_REPORT_CRON:0/30 * * * * ?}
sample.batch.quartz.cleanup-interval-ms=${SAMPLE_BATCH_QUARTZ_CLEANUP_MS:60000}

# @Scheduled (ScheduledJobs): fixed rate, cron (Spring syntax), long running.
spring.task.scheduling.pool.size=4
spring.task.scheduling.thread-name-prefix=batch-scheduling-
sample.batch.fixed-rate-ms=${SAMPLE_BATCH_FIXED_RATE_MS:5000}
sample.batch.fixed-rate-initial-delay-ms=${SAMPLE_BATCH_FIXED_RATE_INITIAL_DELAY_MS:1000}
sample.batch.cron=${SAMPLE_BATCH_CRON:*/10 * * * * *}
sample.batch.long.initial-delay-ms=${SAMPLE_BATCH_LONG_INITIAL_DELAY_MS:1000}
sample.batch.long.interval-ms=${SAMPLE_BATCH_LONG_INTERVAL_MS:40000}
sample.batch.long.duration-ms=${SAMPLE_BATCH_LONG_DURATION_MS:20000}
sample.batch.long.slice-ms=${SAMPLE_BATCH_LONG_SLICE_MS:500}

# Spring Batch settleStep: price every item with its own query (one SQL per item, 20,000 per run)
# instead of the in-memory price table. Off by default (the smoke's timings stay unchanged).
sample.batch.per-item-sql=${SAMPLE_BATCH_PER_ITEM_SQL:false}
