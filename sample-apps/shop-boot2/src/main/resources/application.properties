# shop-boot2 settings (Spring Boot 2.7). Switches come from the environment (sample-apps/README.md,
# common SampleConfig); the data source is built by common (SampleDataSources), not by Spring Boot.
# shop-war-javax runs the same classes as a WAR and reads this file from the shop-boot2 jar in
# WEB-INF/lib (server.* settings do not apply there: the standalone Tomcat owns the port).
spring.application.name=${SAMPLE_APP_NAME:shop-boot2}
server.port=${SERVER_PORT:8080}
# No spring.threads.virtual.enabled: SAMPLE_VT is not applicable to Spring Boot 2.7 / Java 8 (the
# app logs a warning and /api/runtime reports virtualThreadsSupported=false).
spring.main.banner-mode=off
server.shutdown=immediate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
# Counts Hibernate's SQL statements per request: sqlStatements of GET /api/orders/{id} (1) and
# /api/orders/{id}/items (1 + 20), checked by the smoke (18 §4.2).
spring.jpa.properties.hibernate.session_factory.statement_inspector=io.argos.sample.boot2.jpa.SqlStatementCounter
spring.sql.init.mode=never
# Error answers carry the exception message: the seed endpoints plant seeds in messages (18 §4.3).
server.error.include-message=always
# No /** static resource handler, so GET /api/not-found-x has no handler at all (18 §4.2); the
# favicon and /static/** are mapped explicitly (SampleConfiguration.addResourceHandlers).
spring.web.resources.add-mappings=false
management.endpoints.web.exposure.include=health
# MDC in every log line (GET /api/mdc-log, F-A20).
logging.pattern.level=%5p [%X]
