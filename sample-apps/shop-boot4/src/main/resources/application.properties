# shop-boot4 settings (Spring Boot 4.x property names). Switches come from the environment
# (sample-apps/README.md, common SampleConfig); the data source is built by common
# (SampleDataSources), not by Spring Boot.
spring.application.name=${SAMPLE_APP_NAME:shop-boot4}
server.port=${SERVER_PORT:8080}
# SAMPLE_VT=true: virtual threads for Tomcat and the application task executor (JDK 21+; on JDK 17
# Spring Boot ignores the switch and /api/runtime reports virtualThreads=false).
spring.threads.virtual.enabled=${SAMPLE_VT:false}
spring.main.banner-mode=off
server.shutdown=immediate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
# Counts Hibernate's SQL statements per request: sqlStatements of GET /api/orders/{id} (1) and
# /api/orders/{id}/items (1 + 20), checked by the smoke (18 §4.2).
spring.jpa.properties.hibernate.session_factory.statement_inspector=io.argos.sample.boot4.jpa.SqlStatementCounter
spring.sql.init.mode=never
# Error answers carry the exception message: the seed endpoints plant seeds in messages (18 §4.3).
# Boot 4 moved server.error.* to spring.web.error.* (the old name is an error-level deprecation).
spring.web.error.include-message=always
# No /** static resource handler, so GET /api/not-found-x has no handler at all (18 §4.2); the
# favicon and /static/** are mapped explicitly (SampleConfiguration.addResourceHandlers).
spring.web.resources.add-mappings=false
management.endpoints.web.exposure.include=health
# MDC in every log line (GET /api/mdc-log, F-A20).
logging.pattern.level=%5p [%X]
