# shop-heavy settings. The first block repeats shop-boot3's application.properties (this file comes
# first on the class path and replaces it); the rest configures the heavy libraries. Every outgoing
# call goes to ext-stub (SAMPLE_EXT_URL); nothing calls the internet.
spring.application.name=${SAMPLE_APP_NAME:shop-heavy}
server.port=${SERVER_PORT:8080}
spring.threads.virtual.enabled=${SAMPLE_VT:false}
spring.main.banner-mode=off
server.shutdown=immediate
spring.jpa.open-in-view=false
spring.sql.init.mode=never
server.error.include-message=always
spring.web.resources.add-mappings=false
spring.jpa.properties.hibernate.session_factory.statement_inspector=io.argos.sample.boot3.jpa.SqlStatementCounter
logging.pattern.level=%5p [%X]

# Startup steps (StartupReport): SAMPLE_HEAVY_WARMUP=false skips them.
sample.heavy.warmup=${SAMPLE_HEAVY_WARMUP:true}

# Actuator: health (smoke) and the Prometheus registry. No mail health check: there is no SMTP
# server, and a failing check would make /actuator/health DOWN.
management.endpoints.web.exposure.include=health,prometheus
management.health.mail.enabled=false

# JPA: Hibernate manages shop-heavy's own tables only (reviews, Envers revisions); the shop tables
# of common are never altered (HeavySchemaFilterProvider). Second-level cache: Hibernate JCache on
# Caffeine, entities opt in (@Cacheable).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.hbm2ddl.schema_filter_provider=io.argos.sample.heavy.jpa.HeavySchemaFilterProvider
spring.jpa.properties.hibernate.cache.use_second_level_cache=true
spring.jpa.properties.hibernate.cache.region.factory_class=jcache
spring.jpa.properties.hibernate.javax.cache.provider=com.github.benmanes.caffeine.jcache.spi.CaffeineCachingProvider
spring.jpa.properties.hibernate.javax.cache.missing_cache_strategy=create
spring.jpa.properties.jakarta.persistence.sharedCache.mode=ENABLE_SELECTIVE

# Spring Cache on Caffeine (bounded).
spring.cache.type=caffeine
spring.cache.cache-names=productSummary
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=60s,recordStats

# Spring Cloud's host info (spring.cloud.client.hostname/ip-address) would reverse-resolve the first
# network interface's address, a DNS query at startup. Ignoring every interface makes it use the
# local host name instead: no lookup leaves the machine.
spring.cloud.inetutils.ignored-interfaces=.*
# Spring Cloud: ext-stub as a statically discovered service (LoadBalancer), OpenFeign timeouts as
# the other outgoing calls (SAMPLE_EXT_*), Resilience4j time limit above the read timeout.
spring.cloud.discovery.client.simple.instances.ext-stub[0].uri=${SAMPLE_EXT_URL:http://127.0.0.1:18080}
spring.cloud.openfeign.client.config.default.connect-timeout=${SAMPLE_EXT_CONNECT_TIMEOUT_MS:5000}
spring.cloud.openfeign.client.config.default.read-timeout=${SAMPLE_EXT_TIMEOUT_MS:1000}
resilience4j.timelimiter.configs.default.timeout-duration=10s
# Report generation (Excel, Word): at most 50 per second, a caller waits up to 5 s for a permit
# (Resilience4j @RateLimiter); every generation is a Micrometer observation (@Observed).
resilience4j.ratelimiter.instances.reports.limit-for-period=50
resilience4j.ratelimiter.instances.reports.limit-refresh-period=1s
resilience4j.ratelimiter.instances.reports.timeout-duration=5s
management.observations.annotations.enabled=true
# Spring Cloud Gateway (server, Web MVC): /gw/ext/** -> ext-stub /**. Its function routes are off:
# they would map /{path} for every request that no controller takes.
spring.cloud.gateway.function.enabled=false
spring.cloud.gateway.server.webmvc.routes[0].id=ext-stub
spring.cloud.gateway.server.webmvc.routes[0].uri=${SAMPLE_EXT_URL:http://127.0.0.1:18080}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/gw/ext/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=2
# Spring Cloud Function web endpoints below /fn (/fn/uppercase, /fn/orderCount).
spring.cloud.function.web.path=/fn

# Mail: composed only (GET /api/heavy/orders/{id}/mail); nothing is sent.
spring.mail.host=127.0.0.1
spring.mail.port=2525

# springdoc: /v3/api-docs (built at startup by the springdoc step) and /swagger-ui.html, both on
# purpose (a sample app, never deployed).
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
