# TEST FIXTURE (T-ST-052 path 2, T-SV-002): the four-step replacement of a 1m rollup and its view
# (13 section 13.2): error_stat_1m -> error_stat_1m_v2 (adds max_elapsed_ms). error_stat_1m has no
# 1h cascade, so no other view reads it. (Until WO-27 this fixture replaced instance_stat_1m; the
# bundled V003 cascades instance_stat_1h from instance_stat_1m (ADR-0010 C-212 (1)), so a procedure
# may no longer drop that table, MigrationCatalog's ordering rule.)
description: replace error_stat_1m by error_stat_1m_v2 (fixture)
steps:
  - id: create_v2
    kind: ddl
    statements:
      - |
        CREATE TABLE IF NOT EXISTS {db}.{p}error_stat_1m_v2
        (
            app_id         UInt32,
            env            LowCardinality(String),
            kind           Enum8('HTTP' = 1, 'BATCH' = 2, 'MESSAGE' = 3),
            error_group_id UInt64,
            service_id     UInt64,
            app_version_id UInt64,
            minute         DateTime('UTC'),
            count          SimpleAggregateFunction(sum, UInt64),
            first_ts       SimpleAggregateFunction(min, DateTime64(3, 'UTC')),
            last_ts        SimpleAggregateFunction(max, DateTime64(3, 'UTC')),
            max_elapsed_ms SimpleAggregateFunction(max, UInt32)
        )
        ENGINE = AggregatingMergeTree
        PARTITION BY toDate(minute)
        ORDER BY (app_id, error_group_id, service_id, app_version_id, minute)
        TTL minute + INTERVAL {retention.rollup-1m-days} DAY
        SETTINGS ttl_only_drop_parts = 1,
                 non_replicated_deduplication_window = 1000,
                 allow_dimensions_outside_sorting_key = 1
      - |
        CREATE MATERIALIZED VIEW IF NOT EXISTS {db}.{p}error_stat_1m_v2_mv TO {db}.{p}error_stat_1m_v2
        SQL SECURITY DEFINER AS {rollup:error_stat_1m_v2}
  - id: backfill
    kind: backfill
    table: error_stat_1m_v2
    unit: day
    days: "{retention.xlog-days}"
  - id: switch
    kind: switch
    alias: error_stat_1m
    table: error_stat_1m_v2
  - id: drop_old
    kind: drop
    statements:
      - DROP VIEW IF EXISTS {db}.{p}error_stat_1m_mv
      - DROP TABLE IF EXISTS {db}.{p}error_stat_1m
