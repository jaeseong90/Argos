#
# Packaged defaults of the Argos server (WO-20). Operators override them with their own
# configuration file (spring.config.additional-location, e.g. conf/application.yml), environment
# variables or command line arguments; every argos.* key, type and default is listed in
# server/src/contractTest/resources/config-keys.txt (T-API-009) and documented on ArgosProperties.
#
# Short environment names (17 §3.8, ADR-0010 C-96): the ${ARGOS_...} placeholders below map the
# documented short names onto the canonical keys (EnvironmentAliases lists them; the names, their
# keys and the server.*/management.server.* defaults are fixed by the contract snapshot
# server/src/contractTest/resources/config-env-aliases.txt, T-API-009). A canonical key
# set anywhere else (configuration file, environment, system property, command line) wins over the
# short name. Retention values are whole days.
#
# At start (PackagedSettingsPostProcessor) an entry whose short name is not set is dropped (the key
# keeps the default of ArgosProperties), and so is every key that SpringApplication default
# properties set (embedding code, tests): this file never overrides them.

spring:
  application:
    name: argos-server
  autoconfigure:
    # WO-24: no Spring Security user store. Argos authenticates with session cookies only
    # (io.argos.server.web.security.SecurityConfig); Boot's in-memory user would also log a
    # generated password. Applies to every application built from this configuration.
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  main:
    banner-mode: off
  jmx:
    enabled: false
  threads:
    virtual:
      # REST and WebSocket requests on virtual threads (12 §11)
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  # No address: every interface (Spring's default; server.address sets another one). ARGOS_HTTP_BIND
  # and ARGOS_GRPC_BIND are host-side publish addresses of the Compose installation, never read by
  # the server (17 §3.8, ADR-0010 C-113).
  port: 8080
  shutdown: graceful
  # WO-24: X-Forwarded-* headers are ignored unless the operator trusts a reverse proxy (also on
  # Kubernetes, where Spring Boot would otherwise trust every private address). Behind a proxy
  # that terminates TLS (17 §3.10) set server.forward-headers-strategy=native and
  # server.tomcat.remoteip.internal-proxies to the proxy's address: the client address (rate
  # limits, audit) and the scheme (HSTS, 16 §9.8) then come from the proxy's headers.
  forward-headers-strategy: none
  # 14 §7.2: request headers up to 16 KB; bodies up to 1 MB (RequestBodyLimitFilter for every
  # content type, the Tomcat limits below for form posts and swallowed uploads).
  max-http-request-header-size: 16KB
  tomcat:
    max-http-form-post-size: 1MB
    max-swallow-size: 1MB
  # ADR-0010 C-190 (15 §14, N-14): gzip for the UI's static files (the page, CSS, JavaScript, SVG)
  # of 2 KB or more when the client accepts it. The list replaces Spring Boot's default on
  # purpose: API JSON, text/plain and CSV are not compressed here, so a response that mixes
  # reflected input with a secret never gets a compression side channel (the XLog points endpoint
  # has its own gzip path). Hashed /assets/** files are cached for a year
  # (StaticAssetsConfiguration); no pre-compressed files.
  compression:
    enabled: true
    mime-types: text/html,text/css,text/javascript,application/javascript,image/svg+xml
    min-response-size: 2KB
  # Error responses never carry messages, stack traces, exception classes or binding details
  # (16 §7.14).
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
    include-binding-errors: never
    include-path: never
    whitelabel:
      enabled: false

management:
  # Management port (02 C-7, SEC-55): 8081 on 127.0.0.1 only, nothing of Actuator on 8080.
  server:
    port: 8081
    address: 127.0.0.1
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
      probes:
        enabled: true
        add-additional-paths: false
      # Applications built from parts of the server (test applications) may lack the
      # "migrations" indicator; the server always has it (RuntimeManagementIT).
      validate-group-membership: false
      group:
        # Readiness (17 §3.5): the start sequence (migrations, WAL recovery) has completed, the
        # application accepts traffic, the PostgreSQL runtime pool answers ("db") and ClickHouse
        # answers SELECT 1 as the reader account within 2 s ("clickhouse",
        # ClickHouseHealthIndicator), and the ingest dispatcher that loads the WAL into ClickHouse
        # has not stopped on a failure ("ingest", IngestHealthIndicator, 12 §3.9). Liveness is
        # separate and does not depend on the databases.
        readiness:
          include: readinessState,migrations,db,clickhouse,ingest
        liveness:
          include: livenessState
    info:
      access: read-only
    prometheus:
      access: read-only
  info:
    defaults:
      enabled: false
  metrics:
    tags:
      application: argos-server
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: ${ARGOS_LOG_LEVEL:INFO}

# WO-24: the runtime OpenAPI document (14 §8), served to viewer sessions only
# (io.argos.server.api.openapi): JSON at /api/v1/openapi, YAML at /api/v1/openapi.yaml. Only the
# REST API is documented; springdoc's default /v3/api-docs paths do not exist, and there is no
# Swagger UI (the UI webjar is not a dependency).
springdoc:
  api-docs:
    # Explicit on purpose: the document is a viewer-only endpoint (OpenApiConfiguration), and an
    # explicit value keeps springdoc from logging "enabled by default ... disable it in production"
    # at every start.
    enabled: true
    path: /api/v1/openapi
  paths-to-match: /api/**
  show-actuator: false
  # 14 §7.4: the REST API answers application/json; charset=utf-8. Operations without an explicit
  # produces are documented as application/json, not */* (CSV operations declare text/csv
  # themselves, 14 §4.17). Documentation only: content negotiation is unchanged.
  default-produces-media-type: application/json
  # The error shape is 14 §2.6 for every operation; the exception handlers are not per-operation
  # responses.
  override-with-generic-response: false
  swagger-ui:
    enabled: false

argos:
  server:
    timezone: ${ARGOS_TZ_DISPLAY:UTC}
  collector:
    # bind: every interface by default (ArgosProperties); ARGOS_GRPC_BIND is a Compose publish
    # address, not a server setting (ADR-0010 C-113).
    tls:
      cert-file: ${ARGOS_TLS_CERT_FILE:conf/tls/server.crt}
      key-file: ${ARGOS_TLS_KEY_FILE:conf/tls/server.key}
  privacy:
    default-ip-mode: ${ARGOS_IP_MODE:masked}
  ui:
    # Operator-wide default elapsed-colour thresholds of the active transactions screen in ms:
    # three positive ascending values (ADR-0010 C-225 (3)). A viewer's own choice in the browser
    # wins; a wrong value logs a WARN and the default applies.
    active-thresholds-ms: 1000,3000,8000
  retention:
    xlog: ${ARGOS_RETENTION_XLOG_DAYS:30}d
    profile: ${ARGOS_RETENTION_PROFILE_DAYS:7}d
    stat: ${ARGOS_RETENTION_RAW_STAT_DAYS:14}d
    metric: ${ARGOS_RETENTION_METRIC_DAYS:14}d
    rollup-1m: ${ARGOS_RETENTION_ROLLUP_1M_DAYS:90}d
    rollup-1h: ${ARGOS_RETENTION_ROLLUP_1H_DAYS:365}d
  postgres:
    url: ${ARGOS_PG_URL:}
    user: ${ARGOS_PG_USER:argos_app}
    password-file: ${ARGOS_PG_PASSWORD_FILE:}
    owner:
      user: ${ARGOS_PG_OWNER_USER:argos}
      password-file: ${ARGOS_PG_OWNER_PASSWORD_FILE:}
  clickhouse:
    url: ${ARGOS_CH_URL:http://clickhouse:8123}
    database: ${ARGOS_CH_DATABASE:argos}
    writer:
      user: ${ARGOS_CH_WRITER_USER:argos_writer}
      password-file: ${ARGOS_CH_WRITER_PASSWORD_FILE:}
    reader:
      user: ${ARGOS_CH_READER_USER:argos_reader}
      password-file: ${ARGOS_CH_READER_PASSWORD_FILE:}
    migrator:
      user: ${ARGOS_CH_MIGRATOR_USER:argos_migrator}
      password-file: ${ARGOS_CH_MIGRATOR_PASSWORD_FILE:}
