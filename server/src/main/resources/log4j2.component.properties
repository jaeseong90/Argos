#
# Log4j settings read before any configuration (17 §11.3, 12 §7.1): every log event of the JVM is
# created by MaskingLogEventFactory, which masks secrets in messages and stack traces.
log4j2.logEventFactory=io.argos.server.config.logging.MaskingLogEventFactory
