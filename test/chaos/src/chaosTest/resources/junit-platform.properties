# SPDX-License-Identifier: Apache-2.0
# One stack per run, shared by the scenario classes in the order of their @Order (T-CH-001 first,
# T-CH-008 last: it resets PostgreSQL). See test/chaos/README.md.
junit.jupiter.testclass.order.default=org.junit.jupiter.api.ClassOrderer$OrderAnnotation
# The run's ChaosSession lives in the root store; closing it stops the stack and writes the report.
junit.jupiter.extensions.store.close.autocloseable.enabled=true
