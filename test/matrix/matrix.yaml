# SPDX-License-Identifier: Apache-2.0
#
# Compatibility matrix: the single definition of its combinations (docs/18 section 6.1, DSN-18-11,
# WO-50). Every row is one Gradle task :agent:agent-testing:matrixTest-<id> that runs the listed
# agent-testing suites against one sample app on one JDK; `./gradlew matrixTest -Pmatrix.combo=<id>`
# or `-Pmatrix.group=<group>` selects rows, the self-hosted argos-matrix runner runs all of them
# (.github/workflows/nightly.yml). `./gradlew :agent:agent-testing:matrixReport` turns the results
# into docs/compatibility-matrix.md. Row fields, the YAML subset this file may use and the verdict
# rules are in test/matrix/README.md; build-logic MatrixCatalog rejects anything else at
# configuration time.
#
# ID ranges: T-MX-001..121 are those of 18 section 6.1. T-MX-114 (devtools), T-MX-130..139 (servlet
# containers, ADR-0010 C-127, C-240 (10)), T-MX-140..149 (transport variants, C-235 (12), C-250 (8))
# and T-MX-150..159 (module boundary versions, C-240 (10), C-237 (11)) are proposed IDs awaiting
# registration in 18 section 6.1. T-MX-017 (the 18 section 3 example, C-232 (9)) is an alias of the
# Boot 3 x JDK 21 x virtual threads row, T-MX-022.
#
# status: gate rows decide the verdict; unverified rows (02 section 9 "△", untested containers) run
# but never fail the nightly and never show as verified. requires: env:NAME, prop:name or os:<family>
# that must be present on the runner; without them the tests skip with the reason and the row is △.

version: 1

suite-sets:
  # The 18 section 6.1 smoke sequence, then the per-area suites it is made of (matrix-parameters.md).
  smoke:
    - io.argos.agent.testing.BytecodeVerificationFlagMatrixTest
    - io.argos.agent.testing.matrix.MatrixSmokeTest
    - io.argos.agent.testing.e2e.SampleAppAgentTest
  boot:
    - io.argos.agent.testing.BytecodeVerificationFlagMatrixTest
    - io.argos.agent.testing.matrix.MatrixSmokeTest
    - io.argos.agent.testing.matrix.ServiceNameBoundaryTest
    - io.argos.agent.testing.e2e.SampleAppAgentTest
    - io.argos.agent.testing.e2e.LoadLeakE2eTest
    - io.argos.agent.testing.servlet.*
    - io.argos.agent.testing.async.*
    - io.argos.agent.testing.httpclient.*
    - io.argos.agent.testing.command.ThreadDumpVirtualTest
  boot-required:
    - io.argos.agent.testing.matrix.MatrixSmokeTest
    - io.argos.agent.testing.e2e.SampleAppAgentTest
  war:
    - io.argos.agent.testing.BytecodeVerificationFlagMatrixTest
    - io.argos.agent.testing.e2e.WarAppAgentTest
    - io.argos.agent.testing.servlet.War*
    - io.argos.agent.testing.matrix.WarRedeployTest
    - io.argos.agent.testing.matrix.JspForwardTest
  war-required:
    - io.argos.agent.testing.e2e.WarAppAgentTest
    - io.argos.agent.testing.matrix.WarRedeployTest
    - io.argos.agent.testing.matrix.JspForwardTest
  jdbc:
    - io.argos.agent.testing.BytecodeVerificationFlagMatrixTest
    - io.argos.agent.testing.jdbc.*
  batch:
    - io.argos.agent.testing.BytecodeVerificationFlagMatrixTest
    - io.argos.agent.testing.batch.*
  container:
    - io.argos.agent.testing.BytecodeVerificationFlagMatrixTest
    - io.argos.agent.testing.matrix.MatrixSmokeTest
    - io.argos.agent.testing.matrix.ServiceNameBoundaryTest
    - io.argos.agent.testing.servlet.StreamingTest
    - io.argos.agent.testing.servlet.RequestBoundaryTest
    - io.argos.agent.testing.servlet.FallbackNameTest
  container-required:
    - io.argos.agent.testing.matrix.MatrixSmokeTest
    - io.argos.agent.testing.servlet.StreamingTest
  coexist:
    - io.argos.agent.testing.BytecodeVerificationFlagMatrixTest
    - io.argos.agent.testing.matrix.CoexistenceTest

