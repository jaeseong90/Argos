#
# Testcontainers configuration of every JVM that uses test/storage/clickhouse-support (the storage
# integration tests and the storage benchmark tools; no other project of the repository uses
# Testcontainers). Testcontainers reads testcontainers.properties from the classpath.
#
# The resource reaper image (Ryuk) is pinned by the digest of its multi-arch manifest list, like the
# ClickHouse images of deploy/clickhouse/image.properties: Testcontainers substitutes its built-in
# testcontainers/ryuk:0.14.0 with this reference, and Docker pulls exactly this digest.
# Verify: docker buildx imagetools inspect testcontainers/ryuk:0.14.0 (Digest line).
ryuk.container.image=testcontainers/ryuk:0.14.0@sha256:7c1a8a9a47c780ed0f983770a662f80deb115d95cce3e2daa3d12115b8cd28f0
