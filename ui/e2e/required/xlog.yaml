#
# docs/05 §2.1 "XLog" as data-driven E2E tests (docs/18 §13, DSN-18-10): one entry per item of the
# WO-33 checklist (docs/04 WO-33 "05 §2.1 체크표", 2.1-1 .. 2.1-10), in checklist order. Each item
# opens the XLog screen of the seeded stack and runs a named check of e2e/required/xlogChecks.ts that
# asserts exact values from the URL, the seed manifest or the API asked the same question. Items the
# seed cannot show yet are test.fixme naming the owning work order (ADR-0010 C-205 (2)).
screen: xlog
title: XLog screen
source: docs/05 §2.1
items:
  - id: 2.1-1
    title: time and response time axes, linear or log, three status colours, the latency threshold line
    req: [F-U02]
    owner: WO-33
    route: /apps/{primary_app_id}/xlog?from={mid15_from}&to={mid15_to}
    assert:
      - visible: xlog-canvas
      - check: xlogAxesStatusThreshold

  - id: 2.1-2
    title: a drag shows the summary (count, top 10 services, instance, error class and HTTP status distributions, row click filters the list) and the list
    req: [F-U02]
    owner: WO-33
    # The transaction search is HEAVY (10 per user per minute): the items that search most are
    # spread over the seeded users.
    role: operator
    route: /apps/{primary_app_id}/xlog?from={mid15_from}&to={mid15_to}
    assert:
      - visible: xlog-canvas
      - check: xlogDragSummaryList

  - id: 2.1-3
    title: colour by status (default), instance or top services, named in the legend
    req: [F-U02]
    owner: WO-33
    route: /apps/{primary_app_id}/xlog?from={mid15_from}&to={mid15_to}
    assert:
      - visible: xlog-legend
      - check: xlogColorBy

  - id: 2.1-4
    title: realtime 5-minute window moving left, pause, refill of the gap on resume and reconnect
    req: [F-U02, F-U16]
    owner: WO-33
    route: /apps/{primary_app_id}/xlog?from=now-5m&live=1
    assert:
      - visible: xlog-page
      - check: xlogLiveWindow

  - id: 2.1-5
    title: point hover shows service, response time, status and instance; a click opens the detail
    req: [F-U02]
    owner: WO-33
    route: /apps/{primary_app_id}/xlog?from={mid15_from}&to={mid15_to}
    assert:
      - visible: xlog-canvas
      - check: xlogHoverAndClick

  - id: 2.1-6
    title: service, instance, error and kind filters apply to the scatter at once; batch switches the y axis to seconds or minutes
    req: [F-U02]
    owner: WO-33
    route: /apps/{primary_app_id}/xlog?from={mid15_from}&to={mid15_to}
    assert:
      - visible: xlog-canvas
      - check: xlogFiltersAndBatch

  - id: 2.1-7
    title: more than 100,000 points show "Showing N of M" and the same points after a reload
    req: [F-U02, F-U14]
    owner: WO-33
    route: /apps/{primary_app_id}/xlog?from={range_from}&to={range_to}
    assert:
      - visible: xlog-page
      - check: xlogSamplingDeterministic

  - id: 2.1-8
    title: the list has the required columns, a column chooser, server sorting and the server CSV export
    req: [F-U02, SEC-63]
    owner: WO-33
    role: operator
    route: /apps/{primary_app_id}/xlog?from={mid15_from}&to={mid15_to}
    assert:
      - visible: xlog-list
      - check: xlogListColumnsSortCsv

  - id: 2.1-9
    title: Up, Down and Enter in the list open the detail with the ts hint and the list to return to
    req: [F-U02]
    owner: WO-33
    route: /apps/{primary_app_id}/xlog?from={mid15_from}&to={mid15_to}
    assert:
      - visible: xlog-list
      - check: xlogListKeyboard

  # The screen is WO-33's; the outage it shades is real since WO-22 (ADR-0010 C-205 (2)): the
  # stack setup cuts the traffic agent's gRPC path until the instance is STALE and restores it
  # (seed manifest `outage`). The check opens the traffic app around that outage itself.
  - id: 2.1-10
    title: collection outages are shaded on the scatter
    req: [F-U02, D-18]
    owner: WO-33
    route: /apps/{traffic_app_id}/xlog
    assert:
      - visible: xlog-page
      - check: xlogOutageShading

  - id: 2.1-10
    title: event markers on the scatter, alert= emphasises its event
    req: [F-U02, F-U14]
    owner: WO-33
    route: /apps/{primary_app_id}/xlog?from={range_from}&to={range_to}
    assert:
      - visible: xlog-page
      - check: xlogEventMarkers
